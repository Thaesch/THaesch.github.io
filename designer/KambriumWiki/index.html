<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kambrium Wiki - Interaktive Enzyklopädie</title>
  <meta name="description" content="Eine interaktive, detaillierte Enzyklopädie über das Kambrium-Zeitalter. Entdecke Flora, Fauna, Plattentektonik und die biologische Explosion des Urmeers.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  
  <div id="app-container">
    
    <!-- Mobile Header -->
    <header class="mobile-header">
      <div class="logo-container" style="margin-bottom: 0;">
        <div class="logo-icon">K</div>
        <div class="logo-text">
          <h1 style="font-size: 16px;">Kambrium</h1>
        </div>
      </div>
      <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Menü öffnen">
        <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </header>

    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <div class="logo-container">
        <div class="logo-icon">K</div>
        <div class="logo-text">
          <h1>KambriumWiki</h1>
          <p>Erdaltertum</p>
        </div>
      </div>

      <!-- Live Fuzzy Search Box -->
      <div class="search-wrapper">
        <input type="text" id="wiki-search" class="search-input" placeholder="Fuzzy-Suche..." autocomplete="off">
        <svg class="search-icon-svg" viewBox="0 0 24 24">
          <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>
      </div>

      <!-- Sidebar Navigation Menu -->
      <nav>
        <ul class="nav-menu">
          <li class="nav-item active">
            <button data-tab="overview">
              <svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18" stroke-linecap="round"/></svg>
              <span>Übersicht</span>
            </button>
          </li>
          <li class="nav-item">
            <button data-tab="flora">
              <svg viewBox="0 0 24 24"><path d="M12 2L2 22h20L12 2z" stroke-linecap="round"/></svg>
              <span>Flora</span>
            </button>
          </li>
          <li class="nav-item">
            <button data-tab="fauna">
              <svg viewBox="0 0 24 24"><path d="M4.5 16.5c-1.5 1.5-2.5 3.5-2.5 5.5h20c0-2-1-4-2.5-5.5" stroke-linecap="round"/><circle cx="12" cy="9" r="5"/></svg>
              <span>Fauna</span>
            </button>
          </li>
          <li class="nav-item">
            <button data-tab="geography">
              <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z" stroke-linecap="round"/><path d="M12 6v12M6 12h12" stroke-linecap="round"/></svg>
              <span>Geographie & Biome</span>
            </button>
          </li>
        </ul>
      </nav>

      <div class="sidebar-footer">
        Kambrium Wiki v1.0<br>
        JeToGames &copy; 2026
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      
      <!-- Hero Header (dynamically updated) -->
      <section class="hero-section">
        <div class="hero-badge">Erdgeschichte / Paläozoikum</div>
        <h1 class="hero-title">Das Kambrium</h1>
        <p class="hero-subtitle">Das goldene Zeitalter der ersten komplexen Lebensformen</p>
      </section>

      <!-- Live Search Results Overlay -->
      <div id="search-results" class="search-results-overlay"></div>

      <!-- Page Content Container -->
      <div class="page-content">
        <!-- 1. Overview Page -->
        <div id="page-overview" class="page-container active"></div>

        <!-- 2. Flora Page -->
        <div id="page-flora" class="page-container"></div>

        <!-- 3. Fauna Page -->
        <div id="page-fauna" class="page-container"></div>

        <!-- 4. Geography Page -->
        <div id="page-geography" class="page-container"></div>
      </div>

    </main>

  </div>

  <!-- Modal for Species Details & Image Search -->
  <div id="species-modal" class="modal-overlay">
    <div class="modal-content">
      <button class="modal-close-btn" id="modal-close" aria-label="Schließen">&times;</button>
      <div class="modal-header">
        <h3 id="modal-title">Spezies Name</h3>
        <div id="modal-subtitle">Scientific Name</div>
      </div>
      <div class="modal-body">
        <div id="modal-wiki-content">
          <div class="spinner"></div>
          <p style="text-align: center; color: var(--text-muted);">Lade Details...</p>
        </div>
        <div class="modal-actions">
          <a id="modal-google-link" href="#" target="_blank" class="modal-btn">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" style="margin-right: 8px; vertical-align: middle;">
              <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
            </svg>
            Google Bildersuche öffnen
          </a>
        </div>
      </div>
    </div>
  </div>

  <!-- Loading Scripts -->
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
